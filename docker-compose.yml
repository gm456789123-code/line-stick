services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: line_stick
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      WP_DB_NAME: line_stick
      WP_DB_USER: root
      WP_DB_PASSWORD: root
      WP_DB_HOST: db:3306
      WP_HOME: http://localhost:8080
      WP_SITEURL: http://localhost:8080
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
      - ./Security:/var/www/Security
      - ./includes:/var/www/includes

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_WP_BASE_URL: http://localhost:8080
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  db_data:
